<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="agrasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadowAgras" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#064E3B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#agrasBg)"/>
  <ellipse cx="300" cy="355" rx="180" ry="24" fill="#064E3B" opacity="0.16"/>

  <g filter="url(#shadowAgras)">
    <!-- Sprayer Bars & Mist Nozzles (Green fine mist) -->
    <path d="M110 320 L490 320" stroke="#15803D" stroke-width="4" stroke-dasharray="8 6"/>
    <circle cx="140" cy="320" r="6" fill="#16A34A"/>
    <circle cx="240" cy="320" r="6" fill="#16A34A"/>
    <circle cx="360" cy="320" r="6" fill="#16A34A"/>
    <circle cx="460" cy="320" r="6" fill="#16A34A"/>

    <!-- High Clearance Legs -->
    <line x1="210" y1="220" x2="170" y2="330" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <line x1="390" y1="220" x2="430" y2="330" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>

    <!-- Reinforced Agricultural Rotor Arms -->
    <path d="M250 190 L90 250 L75 265 L80 290 L125 280 L260 210 Z" fill="#0F172A"/>
    <circle cx="85" cy="275" r="26" fill="#15803D" stroke="#0F172A" stroke-width="3"/>
    <ellipse cx="85" cy="275" rx="110" ry="16" fill="#22C55E" opacity="0.3" stroke="#16A34A" stroke-width="2"/>

    <path d="M350 190 L510 250 L525 265 L520 290 L475 280 L340 210 Z" fill="#0F172A"/>
    <circle cx="515" cy="275" r="26" fill="#15803D" stroke="#0F172A" stroke-width="3"/>
    <ellipse cx="515" cy="275" rx="110" ry="16" fill="#22C55E" opacity="0.3" stroke="#16A34A" stroke-width="2"/>

    <path d="M260 150 L100 90 L85 75 L80 55 L125 65 L270 130 Z" fill="#0F172A"/>
    <circle cx="95" cy="65" r="26" fill="#15803D" stroke="#0F172A" stroke-width="3"/>
    <ellipse cx="95" cy="65" rx="110" ry="16" fill="#22C55E" opacity="0.3" stroke="#16A34A" stroke-width="2"/>

    <path d="M340 150 L500 90 L515 75 L520 55 L475 65 L330 130 Z" fill="#0F172A"/>
    <circle cx="505" cy="65" r="26" fill="#15803D" stroke="#0F172A" stroke-width="3"/>
    <ellipse cx="505" cy="65" rx="110" ry="16" fill="#22C55E" opacity="0.3" stroke="#16A34A" stroke-width="2"/>

    <!-- Central 20L Spray Payload Tank -->
    <rect x="235" y="115" width="130" height="135" rx="24" fill="url(#tankGrad)" stroke="#15803D" stroke-width="3.5"/>
    <text x="300" y="165" font-family="sans-serif" font-size="18" font-weight="900" fill="#166534" text-anchor="middle">AGRAS T25</text>
    <text x="300" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">20L · Cuve Épandage</text>

    <!-- Radar Dome Top -->
    <circle cx="300" cy="115" r="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="300" cy="115" r="6" fill="#F59E0B"/>
  </g>

  <!-- Tag -->
  <g transform="translate(30, 30)">
    <rect width="215" height="32" rx="8" fill="#15803D"/>
    <text x="107" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Agricole 20L · Radar 360°</text>
  </g>
</svg>

