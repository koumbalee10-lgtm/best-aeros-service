<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="m3eBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="m3eBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadowM3e" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0B1F3A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#m3eBg)"/>
  <ellipse cx="300" cy="350" rx="170" ry="26" fill="#0B1F3A" opacity="0.16"/>

  <g filter="url(#shadowM3e)">
    <!-- Pro Carbon Arms -->
    <path d="M260 220 L130 275 L110 290 L115 312 L160 300 L275 235 Z" fill="#0F172A"/>
    <circle cx="120" cy="300" r="22" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <ellipse cx="120" cy="300" rx="95" ry="15" fill="#475569" opacity="0.45" stroke="#334155" stroke-width="2"/>

    <path d="M340 220 L470 275 L490 290 L485 312 L440 300 L325 235 Z" fill="#0F172A"/>
    <circle cx="480" cy="300" r="22" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <ellipse cx="480" cy="300" rx="95" ry="15" fill="#475569" opacity="0.45" stroke="#334155" stroke-width="2"/>

    <path d="M270 170 L140 115 L120 100 L115 80 L160 90 L280 155 Z" fill="#0F172A"/>
    <circle cx="130" cy="90" r="22" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <ellipse cx="130" cy="90" rx="95" ry="15" fill="#475569" opacity="0.45" stroke="#334155" stroke-width="2"/>

    <path d="M330 170 L460 115 L480 100 L485 80 L440 90 L320 155 Z" fill="#0F172A"/>
    <circle cx="470" cy="90" r="22" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <ellipse cx="470" cy="90" rx="95" ry="15" fill="#475569" opacity="0.45" stroke="#334155" stroke-width="2"/>

    <!-- Rugged Enterprise Body -->
    <path d="M275 105 C290 88 310 88 325 105 L360 175 C372 210 360 250 345 280 L320 295 C308 302 292 302 280 295 L255 280 C240 250 228 210 240 175 Z" fill="url(#m3eBody)" stroke="#475569" stroke-width="2"/>

    <!-- RTK Top Module (Mavic 3 Enterprise Distinctive Cylinder Dome) -->
    <rect x="282" y="145" width="36" height="30" rx="6" fill="#F8FAFC" stroke="#0B1F3A" stroke-width="2"/>
    <circle cx="300" cy="160" r="8" fill="#F59E0B"/>
    <text x="300" y="164" font-family="sans-serif" font-size="8" font-weight="900" fill="#0B1F3A" text-anchor="middle">RTK</text>

    <!-- 4/3 CMOS Mechanical Shutter Dual Sensor (Wide + 56x Tele) -->
    <rect x="278" y="65" width="44" height="42" rx="10" fill="#020617" stroke="#F59E0B" stroke-width="2.5"/>
    <!-- Large 4/3 CMOS Sensor -->
    <circle cx="300" cy="80" r="11" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
    <circle cx="300" cy="80" r="5" fill="#38BDF8"/>
    <!-- 56x Hybrid Zoom Camera -->
    <circle cx="300" cy="96" r="6" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="300" cy="96" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- Tag -->
  <g transform="translate(30, 30)">
    <rect width="185" height="32" rx="8" fill="#0B1F3A"/>
    <text x="92" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F59E0B" text-anchor="middle">RTK Centimétrique · 4/3 CMOS</text>
  </g>
