<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="miniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B1F3A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#miniBg)"/>
  
  <!-- Shadow on Ground -->
  <ellipse cx="300" cy="340" rx="140" ry="24" fill="#0B1F3A" opacity="0.12"/>
  
  <g filter="url(#shadow)">
    <!-- Rear Left Arm -->
    <path d="M260 210 L160 250 L140 260 L145 280 L180 270 L270 220 Z" fill="url(#armGrad)"/>
    <circle cx="150" cy="270" r="18" fill="#475569"/>
    <ellipse cx="150" cy="270" rx="70" ry="12" fill="#94A3B8" opacity="0.4" stroke="#64748B" stroke-width="1.5"/>

    <!-- Rear Right Arm -->
    <path d="M340 210 L440 250 L460 260 L455 280 L420 270 L330 220 Z" fill="url(#armGrad)"/>
    <circle cx="450" cy="270" r="18" fill="#475569"/>
    <ellipse cx="450" cy="270" rx="70" ry="12" fill="#94A3B8" opacity="0.4" stroke="#64748B" stroke-width="1.5"/>

    <!-- Front Left Arm -->
    <path d="M270 170 L170 130 L150 120 L145 100 L180 110 L280 160 Z" fill="url(#armGrad)"/>
    <circle cx="160" cy="110" r="18" fill="#475569"/>
    <ellipse cx="160" cy="110" rx="70" ry="12" fill="#94A3B8" opacity="0.4" stroke="#64748B" stroke-width="1.5"/>

    <!-- Front Right Arm -->
    <path d="M330 170 L430 130 L450 120 L455 100 L420 110 L320 160 Z" fill="url(#armGrad)"/>
    <circle cx="440" cy="110" r="18" fill="#475569"/>
    <ellipse cx="440" cy="110" rx="70" ry="12" fill="#94A3B8" opacity="0.4" stroke="#64748B" stroke-width="1.5"/>

    <!-- Central Fuselage (Compact Light Aerodynamic) -->
    <path d="M280 120 C290 105 310 105 320 120 L345 180 C350 200 345 230 330 250 L315 260 C305 265 295 265 285 260 L270 250 C255 230 250 200 255 180 Z" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Top Cockpit Lines & Battery Indicator -->
    <path d="M285 140 L315 140 L320 170 L280 170 Z" fill="#F8FAFC" opacity="0.8"/>
    <circle cx="300" cy="190" r="4" fill="#15803D"/>
    <circle cx="290" cy="190" r="3" fill="#15803D"/>
    <circle cx="310" cy="190" r="3" fill="#15803D"/>
    
    <!-- Obstacle Sensors (Front Fisheye) -->
    <circle cx="288" cy="122" r="5" fill="#0B1F3A" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="312" cy="122" r="5" fill="#0B1F3A" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- 4K Camera Gimbal (Front Nose) -->
    <rect x="286" y="90" width="28" height="24" rx="6" fill="#1E293B"/>
    <circle cx="300" cy="102" r="9" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="300" cy="102" r="4" fill="#38BDF8"/>
  </g>

  <!-- Spec Tag -->
  <g transform="translate(30, 30)">
    <rect width="130" height="32" rx="8" fill="#0B1F3A"/>
    <text x="65" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F59E0B" text-anchor="middle">&lt; 249g · 4K HDR</text>
  </g>
</svg>

