    <line x1="220" y1="230" x2="180" y2="330" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="160" y1="330" x2="200" y2="330" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    
    <line x1="380" y1="230" x2="420" y2="330" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="330" x2="440" y2="330" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>

    <!-- Oversized Heavy Industrial Arms -->
    <path d="M250 200 L90 270 L70 285 L75 315 L125 300 L265 220 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="85" cy="300" r="28" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <ellipse cx="85" cy="300" rx="120" ry="18" fill="#64748B" opacity="0.35" stroke="#475569" stroke-width="2.5"/>

    <path d="M350 200 L510 270 L530 285 L525 315 L475 300 L335 220 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="515" cy="300" r="28" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <ellipse cx="515" cy="300" rx="120" ry="18" fill="#64748B" opacity="0.35" stroke="#475569" stroke-width="2.5"/>

    <path d="M260 150 L100 80 L80 65 L75 45 L125 55 L275 130 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="95" cy="55" r="28" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <ellipse cx="95" cy="55" rx="120" ry="18" fill="#64748B" opacity="0.35" stroke="#475569" stroke-width="2.5"/>

    <path d="M340 150 L500 80 L520 65 L525 45 L475 55 L325 130 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="505" cy="55" r="28" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
    <ellipse cx="505" cy="55" rx="120" ry="18" fill="#64748B" opacity="0.35" stroke="#475569" stroke-width="2.5"/>

    <!-- Rugged Main Chassis (IP55 All-Weather) -->
    <rect x="250" y="110" width="100" height="150" rx="16" fill="url(#heavyBody)" stroke="#475569" stroke-width="3"/>
    
    <!-- Dual TB65 Smart Batteries with Latch -->
    <rect x="262" y="130" width="34" height="75" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="304" y="130" width="34" height="75" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="279" cy="190" r="4" fill="#10B981"/>
    <circle cx="321" cy="190" r="4" fill="#10B981"/>

    <!-- Dual D-RTK 2 High-Precision Antennas -->
    <rect x="270" y="80" width="14" height="30" rx="3" fill="#E2E8F0"/>
    <rect x="316" y="80" width="14" height="30" rx="3" fill="#E2E8F0"/>

    <!-- Industrial Triple Sensor Gimbal (Zenmuse H20T Quad Pod) -->
    <rect x="270" y="240" width="60" height="50" rx="12" fill="#020617" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="288" cy="258" r="8" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5"/>
    <circle cx="312" cy="258" r="8" fill="#9333EA" stroke="#F43F5E" stroke-width="1.5"/>
    <circle cx="300" cy="275" r="7" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Tag -->
  <g transform="translate(30, 30)">
    <rect width="210" height="32" rx="8" fill="#F59E0B"/>
    <text x="105" y="21" font-family="sans-serif" font-size="13" font-weight="900" fill="#0B1F3A" text-anchor="middle">IP55 Tout Temps · 55 min Vol</text>
