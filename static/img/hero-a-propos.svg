<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061224"/>
      <stop offset="50%" stop-color="#0B1F3A"/>
      <stop offset="85%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#2A4D7A"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0B1F3A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D274D"/>
      <stop offset="100%" stop-color="#061224"/>
    </linearGradient>
    <linearGradient id="radarBeam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="800" fill="url(#skyGrad)"/>

  <!-- Golden Equatorial Horizon Glow -->
  <circle cx="960" cy="520" r="600" fill="url(#amberGlow)"/>

  <!-- Distant Hills & Forest Canopy Contours (Gabon Interior) -->
  <path d="M0 580 Q320 540 680 570 T1360 550 Q1680 560 1920 590 L1920 800 L0 800 Z" fill="#081830" opacity="0.8"/>
  <path d="M0 620 Q400 580 850 610 T1600 590 Q1800 600 1920 630 L1920 800 L0 800 Z" fill="#0A1E3B" opacity="0.9"/>

  <!-- Atlantic Coastline / Libreville Estuary Water Body -->
  <path d="M0 660 C450 640 900 680 1400 650 C1650 635 1800 650 1920 670 L1920 800 L0 800 Z" fill="url(#oceanGrad)"/>

  <!-- Navigation Grid & Topography Lines (Smart Flight Corridor) -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.12">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="350" x2="1920" y2="350"/>
    <line x1="0" y1="500" x2="1920" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="750" y1="0" x2="750" y2="800"/>
    <line x1="1200" y1="0" x2="1200" y2="800"/>
    <line x1="1650" y1="0" x2="1650" y2="800"/>
  </g>

  <!-- Flight Path Trail (Gold Dotted Vector) -->
  <path d="M150 480 Q600 280 1150 320 T1750 210" stroke="#F59E0B" stroke-width="3" stroke-dasharray="10 8" fill="none" opacity="0.45"/>

  <!-- Drone Scanning Cone (Active Lidar/Camera Survey) -->
  <polygon points="1420,240 1200,680 1640,680" fill="url(#radarBeam)" opacity="0.25"/>

  <!-- Detailed Enterprise Inspection Drone in Flight -->
  <g transform="translate(1360, 180)">
    <!-- Drone Arms & Motors -->
    <line x1="20" y1="50" x2="100" y2="50" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="60" y2="80" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Rotors spinning glow -->
    <ellipse cx="20" cy="50" rx="45" ry="8" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="20" cy="50" r="10" fill="#0B1F3A" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="20" cy="50" r="3" fill="#F59E0B"/>

    <ellipse cx="100" cy="50" rx="45" ry="8" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="100" cy="50" r="10" fill="#0B1F3A" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="100" cy="50" r="3" fill="#F59E0B"/>

    <ellipse cx="60" cy="20" rx="8" ry="38" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="60" cy="20" r="10" fill="#0B1F3A" stroke="#FFFFFF" stroke-width="2"/>

    <ellipse cx="60" cy="80" rx="8" ry="38" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="60" cy="80" r="10" fill="#0B1F3A" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Central Fuselage Body -->
    <rect x="42" y="34" width="36" height="32" rx="10" fill="#F59E0B"/>
    <rect x="46" y="38" width="28" height="24" rx="7" fill="#0B1F3A"/>
    <circle cx="60" cy="50" r="6" fill="#38BDF8"/>

    <!-- Strobe Navigation Lights (Green right, Red left) -->
    <circle cx="100" cy="50" r="5" fill="#10B981"/>
    <circle cx="20" cy="50" r="5" fill="#EF4444"/>
    <circle cx="60" cy="30" r="4" fill="#F59E0B"/>
  </g>

  <!-- GPS Waypoint Target Markers -->
  <g transform="translate(620, 360)">
    <circle cx="0" cy="0" r="18" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <circle cx="0" cy="0" r="5" fill="#F59E0B"/>
    <text x="24" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F59E0B">WP-01 &bull; Akanda</text>
  </g>

  <g transform="translate(1080, 310)">
    <circle cx="0" cy="0" r="18" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <circle cx="0" cy="0" r="5" fill="#38BDF8"/>
    <text x="24" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38BDF8">WP-02 &bull; Essassi</text>
  </g>
</svg>

