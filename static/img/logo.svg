<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" fill="none">
  <!-- Drone Symbol -->
  <g transform="translate(10, 10)">
    <!-- Diagonal Arms -->
    <line x1="50" y1="50" x2="20" y2="20" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="80" y2="20" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="20" y2="80" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="80" y2="80" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Rotors (Outer White Rings with Slate Accent) -->
    <circle cx="20" cy="20" r="14" fill="#0B1F3A" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="20" cy="20" r="5" fill="#F59E0B"/>
    
    <circle cx="80" cy="20" r="14" fill="#0B1F3A" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="80" cy="20" r="5" fill="#F59E0B"/>
    
    <circle cx="20" cy="80" r="14" fill="#0B1F3A" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="20" cy="80" r="5" fill="#F59E0B"/>
    
    <circle cx="80" cy="80" r="14" fill="#0B1F3A" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle cx="80" cy="80" r="5" fill="#F59E0B"/>
    
    <!-- Central Fuselage (Rounded Square Amber with Camera Eye) -->
    <rect x="34" y="34" width="32" height="32" rx="10" fill="#F59E0B"/>
    <circle cx="50" cy="50" r="8" fill="#0B1F3A"/>
    <circle cx="50" cy="50" r="4" fill="#F59E0B"/>
  </g>

  <!-- Typography -->
  <text x="120" y="55" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">BEST AÉROS SERVICE</text>
  <text x="122" y="86" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#F59E0B" letter-spacing="2.2">Achat · Immatriculation · Formation</text>
</svg>

