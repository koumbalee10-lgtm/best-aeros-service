{% extends 'base.html' %}
{% load static %}

{% block title %}Mot de passe modifié – {{ APP_NAME }}{% endblock %}

{% block content %}
<section style="min-height:70vh; display:flex; align-items:center; justify-content:center; padding:3rem 1rem; background:#F8FAFC;">
  <div style="width:100%; max-width:440px;">
    <div class="carte" style="padding:2.25rem; border-radius:16px; text-align:center;">
      <div style="font-size:3rem; margin-bottom:1rem;">✅</div>
      <h1 style="font-size:1.5rem; font-weight:800; color:#1E3A8A; margin-bottom:0.75rem;">
        Mot de passe modifié !
      </h1>
      <p style="color:#475569; font-size:0.95rem; line-height:1.6; margin-bottom:1.75rem;">
        Votre nouveau mot de passe est actif dès maintenant.
      </p>
      <a href="{% url 'accounts:profile' %}" class="btn btn-ambre btn-bloque" style="padding:0.85rem;">
        Retour à mon profil
      </a>
    </div>
  </div>
</section>
{% endblock %}
